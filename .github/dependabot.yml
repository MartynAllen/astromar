version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week for routine version bumps rather than a swarm.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # adm-zip — GHSA-vwc7-r8mq-g2x9 (symlink-following zip extraction).
      # No patched release exists (advisory lists "Patched versions: None"),
      # and it's only reachable via the Sanity CLI extracting a zip — build
      # tooling, never in the deployed bundle or runtime. Accepted risk;
      # drop this entry once adm-zip ships a fix.
      #
      # Note: this suppresses Dependabot *version-update* PRs for adm-zip.
      # The one-off security alert is dismissed separately in the repo's
      # Security tab (reason: "vulnerable code is not actually used").
      - dependency-name: "adm-zip"
